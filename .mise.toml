# mise configuration for qovery-cli
# Install mise: https://mise.jdx.dev/getting-started.html
# Usage: mise install

[tools]
# Go version - latest stable release
go = "1.25.1"

# Development tools
"golangci-lint" = "2.5.0"  # Latest stable version

[env]
# Environment variables can be set here
_.path = ["./bin", "$PATH"]

[tasks.build]
description = "Build the CLI"
run = "go build -ldflags \"-X github.com/qovery/qovery-cli/utils.Version=$(git describe --tags --always)\" -o qovery ."

[tasks.test]
description = "Run tests"
run = "go test -tags=testing ./..."

[tasks.test-verbose]
description = "Run tests with verbose output"
run = "go test -v -tags=testing ./..."

[tasks.test-coverage]
description = "Run tests with coverage"
run = [
    "go test -tags=testing -coverprofile=coverage.out ./...",
    "go tool cover -html=coverage.out -o coverage.html",
    "echo 'Coverage report generated: coverage.html'"
]

[tasks.lint]
description = "Run linter"
run = "golangci-lint run ./..."

[tasks.clean]
description = "Clean build artifacts"
run = "rm -rf dist/ coverage.out coverage.html qovery"

[tasks.install]
description = "Install CLI locally"
depends = ["build"]
run = """
if [ -z "$GOPATH" ]; then
  echo "Error: GOPATH is not set"
  exit 1
fi
cp qovery $GOPATH/bin/
echo "Installed to $GOPATH/bin/qovery"
"""

[tasks.ci-local]
description = "Run CI checks locally"
depends = ["lint", "test", "build"]
run = "echo '✅ All CI checks passed!'"

[tasks.release]
description = "Tag new version and push it (triggers Release workflow: GitHub release, R2, AUR, Docker images)"
usage = '''
arg "<version>" help="Tag to push, e.g. v1.170.0 (default: patch bump of latest tag)" default=""
flag "-y --yes" help="Skip confirmation prompt"
'''
run = '''
#!/usr/bin/env bash
set -euo pipefail

REMOTE="origin"
RELEASE_BRANCH="main"

# vX.Y.Z -> sortable integer, base 10 forced (v1.08.0 is not octal)
ver_num() {
  local major minor patch
  IFS='.' read -r major minor patch <<< "${1#v}"
  echo $(( 10#$major * 10000000000 + 10#$minor * 100000 + 10#$patch ))
}

require_in_sync() {
  git fetch --quiet --tags "$REMOTE"
  if [ "$(git rev-parse HEAD)" != "$(git rev-parse "$REMOTE/$RELEASE_BRANCH")" ]; then
    echo "Error: ${1:-local $RELEASE_BRANCH differs from $REMOTE/$RELEASE_BRANCH. Pull or push first.}" >&2
    exit 1
  fi
}

branch="$(git rev-parse --abbrev-ref HEAD)"
if [ "$branch" != "$RELEASE_BRANCH" ]; then
  echo "Error: on branch '$branch', releases are cut from '$RELEASE_BRANCH'." >&2
  exit 1
fi

if [ -n "$(git status --porcelain)" ]; then
  echo "Error: working tree not clean. Commit or stash first." >&2
  exit 1
fi

echo "==> Fetching $REMOTE"
require_in_sync

# for-each-ref, not `git tag | head`: a pipe closed early kills git with SIGPIPE under pipefail
current="$(git for-each-ref --sort=-v:refname --count=1 --format='%(refname:strip=2)' 'refs/tags/v[0-9]*')"
if [ -z "$current" ]; then
  echo "Error: no v* tag found." >&2
  exit 1
fi

new="${usage_version:-}"
if [ -z "$new" ]; then
  # patch bump of latest tag
  IFS='.' read -r major minor patch <<< "${current#v}"
  new="v${major}.${minor}.$((patch + 1))"
fi

if ! echo "$new" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
  echo "Error: '$new' is not a vX.Y.Z tag." >&2
  exit 1
fi

if [ "$(ver_num "$new")" -le "$(ver_num "$current")" ]; then
  echo "Error: $new is not greater than current tag $current." >&2
  exit 1
fi

if git rev-parse -q --verify "refs/tags/$new" >/dev/null; then
  echo "Error: tag $new already exists locally." >&2
  exit 1
fi

commits="$(git log --oneline "$current..HEAD")"
if [ -z "$commits" ]; then
  echo "Error: no commit since $current, nothing to release." >&2
  exit 1
fi

# strip any user:password from the printed URL
remote_url="$(git remote get-url "$REMOTE" | sed -E 's#://[^/@]*@#://***@#')"

echo
echo "  current tag : $current"
echo "  new tag     : $new"
echo "  remote      : $REMOTE  $remote_url"
echo "  commit      : $(git log -1 --oneline HEAD)"
echo
echo "  $(echo "$commits" | wc -l | tr -d ' ') commit(s) since $current:"
echo "$commits" | sed 's/^/    /'
echo
echo "  Pushing $new triggers .github/workflows/release.yml:"
echo "    GitHub release + binaries, Cloudflare R2 upload, AUR package,"
echo "    Docker images to ECR + GHCR ($new and latest)."
echo

if [ "${usage_yes:-}" != "true" ]; then
  if [ ! -t 0 ]; then
    echo "Error: not a TTY, rerun with --yes to skip confirmation." >&2
    exit 1
  fi
  printf '  Create and push tag %s (current: %s)? [y/N] ' "$new" "$current"
  read -r answer
  case "$answer" in
    y|Y|yes|YES) ;;
    *) echo "Aborted, nothing pushed."; exit 1 ;;
  esac
fi

# main or the tag may have moved while the prompt was open
require_in_sync "$REMOTE/$RELEASE_BRANCH moved meanwhile, nothing pushed. Re-run to release the new HEAD."
if git rev-parse -q --verify "refs/tags/$new" >/dev/null; then
  echo "Error: tag $new appeared on $REMOTE meanwhile, nothing pushed." >&2
  exit 1
fi

git tag -a "$new" -m "$new"
git push "$REMOTE" "$new"

echo
echo "Pushed $new. Release workflow:"
echo "  https://github.com/Qovery/qovery-cli/actions/workflows/release.yml"
'''
