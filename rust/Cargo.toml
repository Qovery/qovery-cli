[workspace]
resolver = "3"
members = ["crates/cobra", "crates/log", "crates/api", "crates/core", "crates/services", "crates/envvars", "crates/cli", "crates/commands/*"]

[workspace.package]
version = "1.175.1"
edition = "2024"
license = "Apache-2.0"
publish = false

[workspace.dependencies]
# internal crates
qovery-cobra = { path = "crates/cobra" }
qovery-log = { path = "crates/log" }
qovery-api = { path = "crates/api" }
qovery-core = { path = "crates/core" }
qovery-services = { path = "crates/services" }
qovery-envvars = { path = "crates/envvars" }

# cli
clap = { version = "4", default-features = false, features = ["std", "error-context", "usage", "string"] }

# serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"

# http / ws
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls", "gzip", "multipart"] }
url = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "io-std", "time", "sync", "signal", "process", "fs"] }
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"

# misc
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4", "serde"] }
semver = "1"
regex = "1"
unicode-width = "0.2"
inquire = "0.7"
crossterm = "0.28"
open = "5"
sha2 = "0.10"
rand = "0.8"
once_cell = "1"
is-terminal = "0.4"
humantime = "2"
tempfile = "3"
libc = "0.2"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
